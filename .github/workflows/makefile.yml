name: Makefile CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Check formatting
              uses: JohnnyMorganz/stylua-action@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  version: 2.5.0
                  args: --check .

            - name: Run LuaLS diagnostics
              uses: mrcjkb/lua-typecheck-action@v1
              with:
                  checklevel: Warning

    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4
            - uses: MunifTanjim/setup-neovim-action@v1

            - name: Install make on Windows
              if: runner.os == 'Windows'
              run: choco install make --no-progress --yes

            - name: Run tests
              run: make test
